<!DOCTYPE html>
{% load static %}
{% load humanize %}
<html lang="uz">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" href="{% static 'lager/css/education_detail.css' %}"/>
    <title>{{ education.title }}</title>
</head>
<body>

<div class="container">
    <div class="image-wrapper" id="imageThumb">
        <img src="{{ education.image.url }}" alt="{{ education.title }}">
    </div>
    <div class="content">
        <h1>{{ education.title }}</h1>
        <p>{{ education.description }}</p>
    </div>
</div>

<!-- Modal oynasi -->
<div id="imageModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeModal">&times;</span>
        <img src="{{ education.image.url }}" alt="{{ education.title }}">
    </div>
</div>

<footer>
    <div class="row">
        <div class="col">
            <img src="/media/logo_pastki_qism.png" alt="" class="logot">
            <p>Specialized educational institutions agency
            </p>
        </div>
        <div class="col">
            <h3>office
                <div class="underline"><span></span></div>
            </h3>
            <p>Address</p>
            <p class="email-id">renessans@gmail.com</p>
            <h4>+99800000000</h4>
        </div>

        <div class="col">
            <h3>NEWsletter
                <div class="underline"><span></span></div>
            </h3>
            <form>
                <i class="fa-solid fa-envelope"></i>
                <input type="email" placeholder="Enter your email" required>
                <button type="submit"><i class="fa-solid fa-arrow-right"></i></button>
            </form>
            <div class="social-icons">
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-telegram"></i>
                <i class="fa-brands fa-twitter"></i>
            </div>
        </div>
    </div>
    <hr>
    <p class="copyright">2025</p>
    </hr>
</footer>
<script>
    const imageThumb = document.getElementById('imageThumb');
    const modal = document.getElementById('imageModal');
    const closeBtn = document.getElementById('closeModal');

    // Rasm bosilganda modalni ochish
    imageThumb.addEventListener('click', () => {
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden'; // orqa scrollni o'chirish
    });

    // Modalni yopish tugmasi bosilganda
    closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
        document.body.style.overflow = 'auto';
    });

    // Modal oynaning fon qismiga bosilganda ham yopish
    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }
    });

    // ESC tugmasi bilan yopish
    document.addEventListener('keydown', (e) => {
        if (e.key === "Escape" && modal.style.display === 'flex') {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }
    });
</script>

</body>
</html>
