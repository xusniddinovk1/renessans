<!-- templates/base.html -->
<!DOCTYPE html>
{% load static %}
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sahifa{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet"/>
    <style>
        /* Statik, markazdagi header menyu */
        header {
          background-color: #f8f8f8;
          padding: 20px 0;
          text-align: center;
          border-bottom: 1px solid #ddd;
        }

        .header__menu ul {
          list-style: none;
          display: flex;
          justify-content: center;
          gap: 40px;
          padding: 0;
          margin: 0;
        }

        .header__menu ul li a {
          text-decoration: none;
          color: #7cc01a;
          font-weight: 600;
          font-size: 16px;
        }

        .header__menu ul li a:hover {
          text-decoration: underline;
        }

        @media (max-width: 768px) {
          .header__menu ul {
            flex-direction: column;
            gap: 15px;
          }
        }
    </style>
    <style>
        .modal-content.bg-dark {
          background-color: rgba(0,0,0,0.85) !important;
          border-radius: 10px;
        }

        .modal-body {
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 1rem;
        }

        #modalImage {
          max-height: 80vh;
          border-radius: 8px;
          box-shadow: 0 0 20px rgba(0,0,0,0.7);
          transition: opacity 0.4s ease;
        }

        .modal-footer {
          background-color: transparent;
          border-top: none;
          justify-content: center !important;
          gap: 20px;
        }

        .modal-footer .btn {
          min-width: 100px;
          font-weight: 600;
          font-size: 1rem;
          opacity: 0.85;
          transition: opacity 0.3s ease;
        }

        .modal-footer .btn:hover {
          opacity: 1;
        }
    </style>
</head>
<body>
<header>
    <nav class="header__menu">
        <ul>
            <li><a href="{% url 'en:about'%}">About Lager</a></li>
            <li><a href="{% url 'en:home_page' %}">Home page</a></li>
            <li><a href="{% url 'en:photos'%}">Photos</a></li>
        </ul>
    </nav>
</header>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>
{% block extra_js %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const images = Array.from(document.querySelectorAll('.gallery-image'));
    const modalImage = document.getElementById('modalImage');
    let currentIndex = 0;

    images.forEach((img, idx) => {
      img.addEventListener('click', function() {
        currentIndex = idx;
        showImage(currentIndex);
        new bootstrap.Modal(document.getElementById('imageModal')).show();
      });
    });

    document.getElementById('nextImage').addEventListener('click', () => {
      if (currentIndex < images.length - 1) {
        currentIndex++;
        showImage(currentIndex);
      }
    });

    document.getElementById('prevImage').addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        showImage(currentIndex);
      }
    });

    function showImage(index) {
      const url = images[index].getAttribute('data-url');
      modalImage.style.opacity = 0;
      setTimeout(() => {
        modalImage.src = url;
        modalImage.style.opacity = 1;
      }, 200);
    }
</script>
</body>
</html>
