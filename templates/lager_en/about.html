{% extends 'lager/base.html' %}
{% block title %}About Us{% endblock %}

{% block content %}
<h2>About Us</h2>

{% for item in context %}
<div class="mb-5">
    <p>{{ item.matn }}</p>
    {% if item.image %}
    <img src="{{ item.rasm.url }}" alt="Rasm" class="img-fluid rounded shadow mt-2">
    {% endif %}
</div>
{% empty %}
<p>No any informations</p>
{% endfor %}

{% endblock %}
